<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="pistol-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4454" />
      <stop offset="50%" stop-color="#242c38" />
      <stop offset="100%" stop-color="#141a22" />
    </linearGradient>
    <linearGradient id="pistol-slide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b3442" />
      <stop offset="70%" stop-color="#384353" />
      <stop offset="100%" stop-color="#1e2530" />
    </linearGradient>
    <linearGradient id="pistol-grip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2731" />
      <stop offset="100%" stop-color="#12171e" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0b0f14" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="180" fill="#f4f6f8" rx="6" />
  <circle cx="120" cy="90" r="68" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <g filter="url(#soft-shadow)">
    <!-- Barrel Tip -->
    <rect x="178" y="66" width="6" height="10" rx="1" fill="#18202a" />

    <!-- Slide / Upper Receiver -->
    <path d="M 68 62 
             L 178 62 
             C 180 62, 181 63, 181 65 
             L 181 83 
             L 165 85 
             L 66 85 
             C 64 85, 63 84, 63 82 
             L 64 64 
             C 64 63, 66 62, 68 62 Z" 
          fill="url(#pistol-slide)" stroke="#121820" stroke-width="1.5" />

    <!-- Slide Serrations (Rear & Front grip cuts) -->
    <path d="M 72 65 L 72 79 M 76 65 L 76 79 M 80 65 L 80 79 M 84 65 L 84 79" 
          stroke="#18202a" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 154 66 L 154 77 M 158 66 L 158 77 M 162 66 L 162 77" 
          stroke="#18202a" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

    <!-- Sights -->
    <rect x="67" y="58" width="5" height="4" rx="0.5" fill="#18202a" />
    <rect x="173" y="59" width="4" height="3" rx="0.5" fill="#18202a" />
    <circle cx="175" cy="60.5" r="0.8" fill="#fff" />

    <!-- Ejection Port -->
    <rect x="122" y="64" width="24" height="8" rx="1" fill="#11161d" />
    <rect x="123" y="65" width="22" height="6" rx="0.5" fill="#2d3748" />

    <!-- Lower Frame -->
    <path d="M 65 83 
             L 168 83 
             L 166 93 
             L 128 93 
             C 126 108, 114 116, 98 116 
             L 94 116 
             L 78 146 
             C 77 148, 75 149, 72 149 
             L 54 145 
             C 52 144, 51 142, 52 140 
             L 60 97 
             L 58 87 
             C 58 84, 61 83, 65 83 Z" 
          fill="url(#pistol-grip)" stroke="#0e1318" stroke-width="1.5" />

    <!-- Trigger Guard & Trigger -->
    <path d="M 124 93 C 124 109, 113 116, 96 116 L 93 93" 
          fill="none" stroke="#1c242f" stroke-width="3" stroke-linecap="round" />
    <path d="M 112 94 C 111 101, 108 106, 103 108" 
          fill="none" stroke="#a67c2e" stroke-width="2.5" stroke-linecap="round" />

    <!-- Grip Texture / Checkering Panel -->
    <path d="M 66 98 L 86 98 L 74 138 L 59 135 Z" 
          fill="#171e27" stroke="#252f3d" stroke-width="1" />
    <line x1="68" y1="104" x2="84" y2="104" stroke="#0e1318" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="66" y1="110" x2="82" y2="110" stroke="#0e1318" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="64" y1="116" x2="80" y2="116" stroke="#0e1318" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="62" y1="122" x2="78" y2="122" stroke="#0e1318" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="60" y1="128" x2="76" y2="128" stroke="#0e1318" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Magazine Base Plate -->
    <path d="M 52 144 L 75 149 L 77 153 L 49 148 Z" fill="#2d3748" stroke="#121820" stroke-width="1" />

    <!-- Takedown Pin & Slide Stop Controls -->
    <rect x="98" y="85" width="8" height="3" rx="1" fill="#4a5568" />
    <rect x="86" y="84" width="7" height="3" rx="1" fill="#334155" />
    <circle cx="72" cy="89" r="2.5" fill="#334155" />
  </g>
</svg>
