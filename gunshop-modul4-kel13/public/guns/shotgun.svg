<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="shotgun-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4556" />
      <stop offset="40%" stop-color="#242d38" />
      <stop offset="100%" stop-color="#141a22" />
    </linearGradient>
    <linearGradient id="shotgun-stock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3728" />
      <stop offset="50%" stop-color="#342417" />
      <stop offset="100%" stop-color="#22160d" />
    </linearGradient>
    <linearGradient id="pump-grip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="soft-shadow-shotgun" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0b0f14" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="240" height="180" fill="#f4f6f8" rx="6" />
  <circle cx="120" cy="90" r="68" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <g filter="url(#soft-shadow-shotgun)">
    <!-- Buttstock (Smooth wooden/composite hunting & tactical profile) -->
    <path d="M 24 74 
             C 32 73, 50 78, 68 81 
             L 84 81 
             L 84 96 
             L 76 104 
             C 72 108, 62 106, 52 100 
             L 30 114 
             C 26 116, 22 114, 22 110 
             L 22 78 
             C 22 75, 23 74, 24 74 Z" 
          fill="url(#shotgun-stock)" stroke="#1a110a" stroke-width="1.2" />

    <!-- Recoil Buttpad -->
    <path d="M 22 77 C 24 77, 26 80, 26 94 C 26 108, 24 111, 22 111 Z" fill="#0f172a" />

    <!-- Receiver (Steel Frame) -->
    <path d="M 84 80 
             L 126 80 
             L 126 96 
             L 84 96 Z" 
          fill="url(#shotgun-metal)" stroke="#0e1318" stroke-width="1.2" />

    <!-- Ejection Port -->
    <rect x="94" y="83" width="18" height="7" rx="1.5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
    <line x1="97" y1="86.5" x2="108" y2="86.5" stroke="#a67c2e" stroke-width="2" />

    <!-- Trigger Guard & Trigger -->
    <path d="M 86 96 C 86 106, 100 106, 100 96" fill="none" stroke="#1e293b" stroke-width="2.5" />
    <path d="M 91 97 C 91 101, 94 102, 94 104" fill="none" stroke="#a67c2e" stroke-width="2" stroke-linecap="round" />

    <!-- Long Shotgun Barrel -->
    <rect x="126" y="81" width="88" height="6.5" fill="url(#shotgun-metal)" stroke="#0e1318" stroke-width="1" />
    <!-- Ventilated Top Rib -->
    <line x1="126" y1="79.5" x2="214" y2="79.5" stroke="#242d38" stroke-width="1" />
    <line x1="140" y1="79.5" x2="140" y2="81" stroke="#242d38" stroke-width="0.8" />
    <line x1="160" y1="79.5" x2="160" y2="81" stroke="#242d38" stroke-width="0.8" />
    <line x1="180" y1="79.5" x2="180" y2="81" stroke="#242d38" stroke-width="0.8" />
    <line x1="200" y1="79.5" x2="200" y2="81" stroke="#242d38" stroke-width="0.8" />

    <!-- Front Bead Sight -->
    <circle cx="213" cy="78" r="1.5" fill="#a67c2e" stroke="#0e1318" stroke-width="0.5" />

    <!-- Under-barrel Tubular Magazine -->
    <rect x="126" y="88.5" width="60" height="5.5" fill="#242d38" stroke="#0e1318" stroke-width="0.8" />
    <rect x="183" y="88" width="4" height="6.5" rx="0.5" fill="#475569" stroke="#0e1318" stroke-width="0.8" />

    <!-- Magazine Tube Bracket Clamp -->
    <rect x="178" y="80.5" width="4" height="14" rx="0.8" fill="#1e293b" stroke="#0e1318" stroke-width="0.8" />

    <!-- Pump Forearm / Slide -->
    <rect x="134" y="85.5" width="34" height="13" rx="2" fill="url(#pump-grip)" stroke="#0f172a" stroke-width="1.2" />
    <!-- Pump Grooves / Grip Serrations -->
    <line x1="139" y1="87" x2="139" y2="97" stroke="#0f172a" stroke-width="1.5" />
    <line x1="143" y1="87" x2="143" y2="97" stroke="#0f172a" stroke-width="1.5" />
    <line x1="147" y1="87" x2="147" y2="97" stroke="#0f172a" stroke-width="1.5" />
    <line x1="151" y1="87" x2="151" y2="97" stroke="#0f172a" stroke-width="1.5" />
    <line x1="155" y1="87" x2="155" y2="97" stroke="#0f172a" stroke-width="1.5" />
    <line x1="159" y1="87" x2="159" y2="97" stroke="#0f172a" stroke-width="1.5" />
    <line x1="163" y1="87" x2="163" y2="97" stroke="#0f172a" stroke-width="1.5" />
  </g>
</svg>
